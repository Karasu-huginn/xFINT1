server {
    listen 80;

    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location / {
        root /usr/share/nginx/html;
        # A single page application owns its own routes, so any unknown path has to
        # return index.html or a browser refresh on /expenses breaks.
        try_files $uri $uri/ /index.html;
    }
}
